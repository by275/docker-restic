name: buildx

on:
  push:
    branches:
      - 'master'
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  TARGET_IMAGE: ghcr.io/by275/restic

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      packages: write
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Buildx and Push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          tags: ${{ env.TARGET_IMAGE }}:ci
          platforms: linux/amd64,linux/arm/v7,linux/arm64
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
      -
        name: Verify Image
        id: vars
        run: |
          set -euo pipefail

          IMAGE="${TARGET_IMAGE}@${{ steps.build.outputs.digest }}"
          VER_FULL=$(docker run --rm --platform linux/amd64 "$IMAGE" version | awk '{print $2}')
          if [[ -z "$VER_FULL" ]]; then
            echo "Unable to determine the image version" >&2
            exit 1
          fi

          echo "ver_full=$VER_FULL" >> "$GITHUB_OUTPUT"
          echo "ver_minor=$(echo "$VER_FULL" | cut -d. -f-2)" >> "$GITHUB_OUTPUT"
          echo "ver_major=$(echo "$VER_FULL" | cut -d. -f-1)" >> "$GITHUB_OUTPUT"
      -
        name: Promote Tags
        run: |
          set -euo pipefail

          IMAGE="${TARGET_IMAGE}@${{ steps.build.outputs.digest }}"
          docker buildx imagetools create \
            --tag "${TARGET_IMAGE}:latest" \
            --tag "${TARGET_IMAGE}:${{ steps.vars.outputs.ver_full }}" \
            --tag "${TARGET_IMAGE}:${{ steps.vars.outputs.ver_minor }}" \
            --tag "${TARGET_IMAGE}:${{ steps.vars.outputs.ver_major }}" \
            "$IMAGE"
      -
        name: Notification
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          description: |
            ${{ env.TARGET_IMAGE }}:latest
            ${{ env.TARGET_IMAGE }}:${{ steps.vars.outputs.ver_full }}
            ${{ env.TARGET_IMAGE }}:${{ steps.vars.outputs.ver_minor }}
            ${{ env.TARGET_IMAGE }}:${{ steps.vars.outputs.ver_major }}
